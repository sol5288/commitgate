name: CI

# 🔴 **수동 실행 전용이다.** push·tag·pull_request·schedule 자동 트리거를 두지 않는다.
#
#    이유는 정책이다: 이 저장소의 CI는 "평소 0회, 사람이 지시할 때만 1회"다. Actions 사용량과
#    한도가 실제 비용이고, 자동 트리거는 그 결정을 사람 손에서 빼앗는다. 3 OS × 3 Node = 9잡이
#    push마다 도는 구조는 그 정책과 정반대였다(0.22.0 RC 점검에서 발견).
#
#    실행 경로는 둘뿐이다:
#      - GitHub UI / `gh workflow run ci.yml --ref <branch>`
#      - `commitgate integrate --run --run-github-ci` (req.config.json 의 `githubCi` 설정 필요)
#    integrate의 대화형 질문은 **기본 No**다 — Enter·빈 문자열·n 은 모두 미실행이다.
#
# 🔴 이 트리거 계약은 테스트로 잠겨 있다: `tests/unit/ci-workflow-policy.test.ts`.
#    자동 트리거를 다시 넣으면 그 테스트가 red다. 되돌리려면 정책부터 바꿀 것.
on:
  workflow_dispatch:

# 명시 요청한 실행은 **취소하지 않는다.** 사람이 한 번 지시한 검사가 뒤이은 지시로 사라지면
# "그 커밋이 검증됐다"는 기록 자체가 없어진다(자동 트리거 시절 main·태그를 예외로 뒀던 것과 같은 이유이며,
# 이제는 모든 실행이 명시 요청이므로 예외가 아니라 규칙이다).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # 교착한 잡이 GitHub 기본값 360분(6시간)을 점유하지 않게 한다.
    #
    # 🔴 **왜 20분인가**: 실측 최장은 windows의 **7.0분**이다(2026-07-27). 그 약 3배로 둔다 —
    #    더 조이면 러너 성능 변동·npm 레지스트리 지연으로 **정상 실행이 죽어 거짓 red**가 난다.
    #    거짓 red는 지금 문제보다 나쁘다(사람이 red를 무시하기 시작한다).
    #
    # 🔴 **두 번째 목적은 로그다**: GitHub는 **진행 중인 잡의 로그를 주지 않는다**
    #    (`gh run view --job <id> --log` → "still in progress"). 2026-07-27 macos node 18이
    #    교착했을 때 원인을 보려고 잡을 **죽여야 했다** — 진단하려면 증거를 없애야 하는 상태였다.
    #    타임아웃으로 종료되면 그 로그가 남는다. 값을 올리려면 이 사실을 함께 고려할 것.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # pack tarball 설치 smoke — Windows 러너에서는 .cmd 경로도 함께 검증됨.
      - run: npm run smoke
