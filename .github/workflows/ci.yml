name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 같은 ref에 연달아 push하면 앞 실행을 취소한다 — 마지막 것만 검사하면 되기 때문이다.
#
# 🔴 단, `main`과 태그(`v*`)는 **취소하지 않는다.** 이 저장소는 direct push(B1) 후 CI를
#    **사후 검증**으로 쓰므로, 앞 실행이 취소되면 "그 커밋이 검증됐다"는 기록 자체가 사라진다.
#    태그도 마찬가지다 — `refs/tags/*`는 `refs/heads/main`과 **다른 ref**라
#    "main이 아니면 취소"로만 쓰면 릴리스 검증이 취소 대상이 된다(두 조건을 모두 적는 이유).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # pack tarball 설치 smoke — Windows 러너에서는 .cmd 경로도 함께 검증됨.
      - run: npm run smoke
