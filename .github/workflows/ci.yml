name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 같은 ref에 연달아 push하면 앞 실행을 취소한다 — 마지막 것만 검사하면 되기 때문이다.
#
# 🔴 단, `main`과 태그(`v*`)는 **취소하지 않는다.** 이 저장소는 direct push(B1) 후 CI를
#    **사후 검증**으로 쓰므로, 앞 실행이 취소되면 "그 커밋이 검증됐다"는 기록 자체가 사라진다.
#    태그도 마찬가지다 — `refs/tags/*`는 `refs/heads/main`과 **다른 ref**라
#    "main이 아니면 취소"로만 쓰면 릴리스 검증이 취소 대상이 된다(두 조건을 모두 적는 이유).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # 교착한 잡이 GitHub 기본값 360분(6시간)을 점유하지 않게 한다.
    #
    # 🔴 **왜 20분인가**: 실측 최장은 windows의 **7.0분**이다(2026-07-27). 그 약 3배로 둔다 —
    #    더 조이면 러너 성능 변동·npm 레지스트리 지연으로 **정상 실행이 죽어 거짓 red**가 난다.
    #    거짓 red는 지금 문제보다 나쁘다(사람이 red를 무시하기 시작한다).
    #
    # 🔴 **두 번째 목적은 로그다**: GitHub는 **진행 중인 잡의 로그를 주지 않는다**
    #    (`gh run view --job <id> --log` → "still in progress"). 2026-07-27 macos node 18이
    #    교착했을 때 원인을 보려고 잡을 **죽여야 했다** — 진단하려면 증거를 없애야 하는 상태였다.
    #    타임아웃으로 종료되면 그 로그가 남는다. 값을 올리려면 이 사실을 함께 고려할 것.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # pack tarball 설치 smoke — Windows 러너에서는 .cmd 경로도 함께 검증됨.
      - run: npm run smoke
